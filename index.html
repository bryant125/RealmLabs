<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Realm Labs | Premium Mobile Engineering</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            neon: '#CEFF00',
          },
          fontFamily: {
            outfit: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Outfit:wght@300;400;600;700;900&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --brand-indigo: #4f46e5;
      --bg-dots: #f1f5f9;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: #ffffff;
      background-image: radial-gradient(var(--bg-dots) 1px, transparent 0);
      background-size: 40px 40px;
      color: #0f172a;
      scroll-behavior: smooth;
    }

    .font-mono-tech {
      font-family: 'JetBrains Mono', monospace;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }

    .animate-float {
      animation: float 6s ease-in-out infinite;
    }

    @keyframes float {

      0%,
      100% {
        transform: translateY(0px) rotate(0deg);
      }

      50% {
        transform: translateY(-15px) rotate(1deg);
      }
    }

    .blueprint-border {
      position: relative;
    }

    .blueprint-border::before {
      content: '';
      position: absolute;
      top: -1px;
      left: -1px;
      width: 10px;
      height: 10px;
      border-top: 2px solid #cbd5e1;
      border-left: 2px solid #cbd5e1;
    }

    .blueprint-border::after {
      content: '';
      position: absolute;
      bottom: -1px;
      right: -1px;
      width: 10px;
      height: 10px;
      border-bottom: 2px solid #cbd5e1;
      border-right: 2px solid #cbd5e1;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.35.0",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
  }
}
</script>
</head>

<body>
  <div id="root"></div>
  <!-- Vite expects the source to be a relative path during build -->
  <script type="module" src="./index.tsx"></script>
</body>

</html>
